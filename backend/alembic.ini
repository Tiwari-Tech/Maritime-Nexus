# Alembic configuration for Maritime Nexus backend

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)s%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Sys.path configuration
prepend_sys_path = src

# Path separator
version_path_separator = os

# Database URL is dynamically set in alembic/env.py from backend.core.config.settings
# Do not store credentials in this file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
